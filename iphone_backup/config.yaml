name: iPhone Backup
version: "0.1.3"
slug: iphone_backup
description: Verschlüsselte iPhone-Backups (pymobiledevice3) direkt nach OneDrive
url: https://github.com/sitaro/ha-addons/tree/main/iphone_backup
arch:
  - amd64
init: false
startup: application
boot: auto
host_network: true
usb: true
stdin: true
homeassistant_api: true
backup_exclude:
  - "*"
options:
  zeitplan: "02:30"
  versuche_bis: "06:00"
  backup_passwort: ""
  onedrive_token: ""
  onedrive_drive_id: ""
  onedrive_drive_type: personal
  ziel: Backup/iphone
  behalten: 3
schema:
  zeitplan: match(^([01]\d|2[0-3]):[0-5]\d$)
  versuche_bis: match(^([01]\d|2[0-3]):[0-5]\d$)
  backup_passwort: password
  onedrive_token: password
  onedrive_drive_id: str?
  onedrive_drive_type: list(personal|business|documentLibrary)
  ziel: str
  behalten: int(1,30)
