configuration:
  zeitplan:
    name: Startzeit
    description: Täglicher Start des Backups (HH:MM).
  versuche_bis:
    name: Versuche bis
    description: Ist das iPhone nicht erreichbar, wird alle 15 Minuten erneut versucht – bis zu dieser Uhrzeit.
  backup_passwort:
    name: Backup-Passwort
    description: Passwort der iOS-Backup-Verschlüsselung. Wird nur benutzt, um die Verschlüsselung einmalig einzuschalten. Unbedingt zusätzlich in 1Password ablegen – ohne dieses Passwort ist das Backup nicht wiederherstellbar.
  onedrive_token:
    name: OneDrive-Token
    description: Optional. Leer = Upload über die OneDrive-Integration von Home Assistant. Mit Token (Ausgabe von `rclone authorize "onedrive"`) wird rclone verwendet.
  onedrive_drive_id:
    name: OneDrive Drive-ID
    description: Leer lassen – wird automatisch ermittelt.
  onedrive_drive_type:
    name: OneDrive-Typ
  ziel:
    name: Zielordner
    description: Zielordner; bei der OneDrive-Integration relativ zu deren App-Ordner.
  behalten:
    name: Anzahl Backups
    description: So viele Backups bleiben im OneDrive, ältere werden gelöscht.
